# District name variants found in DGHS daily dengue PDFs, 2021-12 .. 2026-07.
#
# WHY THIS FILE EXISTS
# --------------------
# The PDFs embed several different font subsets across their five layout eras,
# and the same Bangla district name extracts as a different character sequence
# depending on which subset a given file used. Faridpur, for example, appears
# as ফরিদপুি, ফরিদপযি and ফতরদপুর in different years. 166 distinct strings were
# recovered across 1,635 files, all of them variants of the same 65 entities
# (64 districts + the combined Dhaka Metro figure).
#
# This is NOT a spelling-correction or fuzzy-matching table. Every variant below
# was assigned by two independent pieces of evidence:
#
#   1. POSITION. The district table lists districts in a fixed order, and every
#      file yields exactly 65 rows, so row position identifies the district
#      without reading the glyphs at all. 57 of the 65 positions are stable
#      across all eras and all files.
#
#   2. STRING IDENTITY, for the Chattogram block. Positions 20-27 are NOT
#      order-stable: DGHS reordered Rangamati / Khagrachhari / Bandarban and
#      Noakhali / Cumilla / Chandpur / Lakshmipur between eras (visible in the
#      2024 sample, where the serial numbers themselves run out of sequence:
#      24, 35, 25, 28, 26, 27, 29, 33, 30 ...). Those were mapped by reading the
#      strings, with position used only as a cross-check.
#
# Purely automatic character-folding was tried first and REJECTED: it collapsed
# মাগুরা (Magura) and বগুড়া (Bogura) into one cluster. Two genuinely different
# districts merging silently is exactly the failure this dataset cannot afford,
# so the mapping is explicit and auditable rather than inferred at runtime.
#
# VERIFICATION
# ------------
# The mapping is self-checking: if any two variants of DIFFERENT districts were
# assigned the same canonical name, at least one date would resolve to fewer
# than 65 distinct districts and a duplicate (date, district) pair would appear.
# build_dengue_pdf_district.py asserts exactly this and refuses to write output
# if it fails.
#
# Canonical names match raw/reference/districts.csv exactly.

dhaka_metro:
  canonical: "Dhaka Metro"
  note: >
    DNCC and DSCC combined. DGHS never separates them; this is reported as its
    own row ahead of the ordinary district rows and is NOT one of the 64
    districts. Carried through as a separate unit rather than being folded into
    Dhaka district, which it would otherwise double-count.
  variants: ["ঢাকা হানগি", "ঢাকা মহানগর", "ঢাকা মোনগে", "ঢাকা হানগর"]

